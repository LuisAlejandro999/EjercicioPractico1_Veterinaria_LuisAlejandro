<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formulario de tipo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4"><div class="form-panel mx-auto"><h2 th:text="${tituloFormulario}">Tipo de servicio</h2><p class="text-muted">Complete los datos de la categoría.</p>
<form th:action="@{/tipos/guardar}" th:object="${tipoServicio}" method="post">
<input type="hidden" th:field="*{id}">
<div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input id="nombre" class="form-control" th:field="*{nombre}" required maxlength="100"><div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div></div>
<div class="mb-3"><label class="form-label" for="descripcion">Descripción</label><textarea id="descripcion" class="form-control" th:field="*{descripcion}" rows="3" maxlength="255"></textarea></div>
<div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar</button><a class="btn btn-outline-secondary" th:href="@{/tipos}">Cancelar</a></div>
</form></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
