<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Citas programadas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4"><div class="mb-4"><h2>Citas programadas</h2><p class="text-muted mb-0"></p></div>
<div class="table-responsive panel"><table class="table table-hover align-middle mb-0"><thead><tr><th>Mascota</th><th>Propietario</th><th>Fecha</th><th>Servicio asociado</th></tr></thead><tbody>
<tr th:each="cita : ${citas}"><td class="fw-semibold" th:text="${cita.nombreMascota}"></td><td th:text="${cita.nombrePropietario}"></td><td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td><td th:text="${cita.servicio.nombre}"></td></tr>
<tr th:if="${#lists.isEmpty(citas)}"><td colspan="4" class="text-center py-4">No hay citas programadas.</td></tr></tbody></table></div></main>
<footer th:replace="~{fragments/layout :: footer}"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
