<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${tituloPagina != null ? tituloPagina : 'Clínica Veterinaria Huellitas'}">Clínica Veterinaria Huellitas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
  <header style="background-color: #e0f2fe;">"></header>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>
  <main class="container py-4">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${exito}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <section th:replace="${contenido}"></section>
  </main>
  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
