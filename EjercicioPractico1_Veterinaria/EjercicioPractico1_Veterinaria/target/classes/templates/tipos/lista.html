<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tipos de servicio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
  <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2"><div><h2>Tipos de servicio</h2><p class="text-muted mb-0">Administre las categorías de atención veterinaria.</p></div><a class="btn btn-primary" th:href="@{/tipos/nuevo}">+ Agregar tipo</a></div>
  <div class="table-responsive panel"><table class="table table-hover align-middle mb-0">
    <thead><tr><th>Nombre</th><th>Descripción</th><th>Servicios asociados</th><th class="text-end">Acciones</th></tr></thead>
    <tbody><tr th:each="tipo : ${tipos}"><td class="fw-semibold" th:text="${tipo.nombre}"></td><td th:text="${tipo.descripcion != null ? tipo.descripcion : '—'}"></td><td><span class="badge rounded-pill text-bg-info" th:text="${#lists.size(tipo.servicios)}"></span></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/tipos/editar/{id}(id=${tipo.id})}">Editar</a> <button class="btn btn-sm btn-outline-danger" type="button" data-bs-toggle="modal" th:attr="data-bs-target='#eliminarTipo' + ${tipo.id}">Eliminar</button>
      <div class="modal fade" th:id="'eliminarTipo' + ${tipo.id}" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Confirmar eliminación</h5><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body">¿Desea eliminar el tipo <strong th:text="${tipo.nombre}"></strong>? Solo se podrá eliminar si no tiene servicios asociados.</div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button><form th:action="@{/tipos/eliminar/{id}(id=${tipo.id})}" method="post"><button class="btn btn-danger" type="submit">Sí, eliminar</button></form></div></div></div></div>
    </td></tr><tr th:if="${#lists.isEmpty(tipos)}"><td colspan="4" class="text-center py-4">Todavía no hay tipos de servicio registrados.</td></tr></tbody>
  </table></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
