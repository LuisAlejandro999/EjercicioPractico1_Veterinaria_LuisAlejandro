<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Servicios veterinarios</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4"><div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2"><div><h2>Servicios veterinarios</h2><p class="text-muted mb-0">Consulte precios, duración y categoría.</p></div><a class="btn btn-primary" th:href="@{/servicios/nuevo}">+ Agregar servicio</a></div>
<div class="table-responsive panel"><table class="table table-hover align-middle mb-0"><thead><tr><th>Nombre</th><th>Tipo de servicio</th><th>Precio (₡)</th><th>Duración</th><th class="text-end">Acciones</th></tr></thead>
<tbody><tr th:each="servicio : ${servicios}"><td class="fw-semibold" th:text="${servicio.nombre}"></td><td><span class="badge text-bg-light" th:text="${servicio.tipoServicio.nombre}"></span></td><td th:text="${#numbers.formatDecimal(servicio.precio, 1, 2)}"></td><td th:text="${servicio.duracionMinutos + ' min'}"></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/servicios/editar/{id}(id=${servicio.id})}">Editar</a> <button class="btn btn-sm btn-outline-danger" type="button" data-bs-toggle="modal" th:attr="data-bs-target='#eliminarServicio' + ${servicio.id}">Eliminar</button>
<div class="modal fade" th:id="'eliminarServicio' + ${servicio.id}" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Confirmar eliminación</h5><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Cerrar"></button></div><div class="modal-body">¿Desea eliminar el servicio <strong th:text="${servicio.nombre}"></strong>? No se podrá eliminar si ya tiene citas asociadas.</div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button><form th:action="@{/servicios/eliminar/{id}(id=${servicio.id})}" method="post"><button class="btn btn-danger" type="submit">Sí, eliminar</button></form></div></div></div></div></td></tr>
<tr th:if="${#lists.isEmpty(servicios)}"><td colspan="5" class="text-center py-4">Todavía no hay servicios registrados.</td></tr></tbody></table></div></main>
<footer th:replace="~{fragments/layout :: footer}"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
