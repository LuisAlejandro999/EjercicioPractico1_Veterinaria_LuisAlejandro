<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formulario de servicio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4"><div class="form-panel mx-auto"><h2 th:text="${tituloFormulario}">Servicio veterinario</h2><p class="text-muted">Ingrese los datos del servicio.</p>
<form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post">
<input type="hidden" th:field="*{id}">
<div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input id="nombre" class="form-control" th:field="*{nombre}" required maxlength="100"><div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div></div>
<div class="row g-3"><div class="col-md-6 mb-3"><label class="form-label" for="precio">Precio (₡)</label><input id="precio" type="number" step="0.01" min="0.01" class="form-control" th:field="*{precio}" required><div class="text-danger small" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div></div>
<div class="col-md-6 mb-3"><label class="form-label" for="duracionMinutos">Duración (minutos)</label><input id="duracionMinutos" type="number" min="1" class="form-control" th:field="*{duracionMinutos}" required><div class="text-danger small" th:if="${#fields.hasErrors('duracionMinutos')}" th:errors="*{duracionMinutos}"></div></div></div>
<div class="mb-4"><label class="form-label" for="tipoId">Tipo de servicio</label><select id="tipoId" name="tipoId" class="form-select" required><option value="">Seleccione un tipo...</option><option th:each="tipo : ${tipos}" th:value="${tipo.id}" th:text="${tipo.nombre}" th:selected="${servicio.tipoServicio != null and servicio.tipoServicio.id == tipo.id}"></option></select><div class="text-danger small" th:if="${#fields.hasErrors('tipoServicio')}" th:errors="*{tipoServicio}"></div></div>
<div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar</button><a class="btn btn-outline-secondary" th:href="@{/servicios}">Cancelar</a></div>
</form></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
